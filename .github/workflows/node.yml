name: Node SDK

# The SDK used to be built only during a publish, which meant a broken bundler
# config or manifest surfaced at release time. This runs the same build on every
# change to the binding.

on:
  push:
    branches: [main]
    paths:
      - 'apps/node/**'
      - 'scripts/ci/**'
      - '.github/workflows/node.yml'
  pull_request:
    paths:
      - 'apps/node/**'
      - 'scripts/ci/**'
      - '.github/workflows/node.yml'
  workflow_dispatch:

concurrency:
  group: node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/node

    steps:
      - name: Checkout the node binding
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/node/
            /scripts/ci/

      - uses: actions/setup-node@v4
        with:
          # The bundler requires current Node; runtime ABI compatibility is
          # exercised against the same prebuilt addon in the platform jobs.
          node-version: 24
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # tsdown runs publint as part of the build, so a broken exports map or
      # package manifest fails here instead of after a publish.
      - run: npm run build

      - name: Package entry points resolve
        shell: bash
        run: |
          node -e "const m = require('@pixel.js/shotkit');
            for (const f of ['screenshot', 'start', 'status', 'stop']) if (typeof m[f] !== 'function') throw new Error('CJS entry is missing ' + f);
            if (typeof m.default.screenshot !== 'function') throw new Error('CJS entry is missing the default export');
            console.log('CJS entry ok');"
          node -e "import('@pixel.js/shotkit').then((m) => {
            for (const f of ['screenshot', 'start', 'status', 'stop']) if (typeof m[f] !== 'function') throw new Error('ESM entry is missing ' + f);
            if (typeof m.default.screenshot !== 'function') throw new Error('ESM entry is missing the default export');
            console.log('ESM entry ok');
          });"

      # The option layer needs no engine; the platform artifacts are exercised
      # by build.yml's verify job.
      - name: Option validation
        run: node --import tsx --test test/request.test.mjs

      # Platform workflows provide the native runtime. This job deliberately
      # has none and verifies that start() reports the missing platform addon.
      - name: Native runtime fails cleanly when absent
        run: |
          node -e "try { require('@pixel.js/shotkit').start(); throw new Error('unexpected native runtime') } catch (e) { if (!/shot\.node not found/.test(e.message)) throw e }"
          node -e "require('@pixel.js/shotkit').screenshot({html: '<p>'}).then(() => { throw new Error('unexpected native runtime') }, (e) => { if (!/shot\.node not found/.test(e.message)) throw e })"

      # The CI helpers that decide which engines get built and reused: pure
      # logic with stubbed API responses, plus the fingerprint of this very
      # tree (git ls-tree reads trees, which the blobless checkout has).
      - name: CI helper scripts
        working-directory: .
        run: |
          node --test scripts/ci/*.test.mjs
          node scripts/ci/fingerprint.mjs
