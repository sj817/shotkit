name: Node SDK

# The SDK used to be built only during a publish, which meant a broken bundler
# config or manifest surfaced at release time. This runs the same build on every
# change to the binding.

on:
  push:
    branches: [main]
    paths:
      - 'apps/node/**'
      - '.github/workflows/node.yml'
  pull_request:
    paths:
      - 'apps/node/**'
      - '.github/workflows/node.yml'
  workflow_dispatch:

concurrency:
  group: node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/node

    steps:
      - name: Checkout the node binding
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/node/

      - uses: actions/setup-node@v4
        with:
          # The bundler requires current Node; runtime ABI compatibility is
          # exercised against the same prebuilt addon in the platform jobs.
          node-version: 24
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # tsdown runs publint as part of the build, so a broken exports map or
      # package manifest fails here instead of after a publish.
      - run: npm run build

      - name: Package entry points resolve
        shell: bash
        run: |
          node -e "const m = require('@shotkit/node');
            if (typeof m.launch !== 'function') throw new Error('CJS entry is missing launch');
            console.log('CJS entry ok');"
          node -e "import('@shotkit/node').then((m) => {
            if (typeof m.launch !== 'function') throw new Error('ESM entry is missing launch');
            console.log('ESM entry ok');
          });"

      # Platform workflows provide the native runtime. This job deliberately
      # has none and verifies that launch() reports the missing platform addon.
      - name: Native runtime fails cleanly when absent
        run: |
          node -e "require('@shotkit/node').launch().then(() => { throw new Error('unexpected native runtime') }, (e) => { if (!/shot\.node not found/.test(e.message)) throw e })"
