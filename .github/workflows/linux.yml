name: Linux

on:
  push:
    branches: [main, codex/linux-macos-port]
    paths-ignore:
      - '**.md'
      - '.githooks/**'
  workflow_dispatch:
    inputs:
      lto:
        description: Link-time optimization mode
        type: choice
        options: [full, thin]
        default: full
  workflow_call:
    inputs:
      lto:
        description: Link-time optimization mode
        type: string
        default: full

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    env:
      # See windows.yml: full LTO measured smaller at no wall-clock cost, so it
      # stays the shipped profile; thin remains available through the input.
      SHOT_LTO: ${{ inputs.lto || 'full' }}
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Checkout the ShotKit build closure
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /Source/
            /shot/
            /apps/node/
            /scripts/
            /tests/
            /Tools/
            /CMakeLists.txt
            /CMakePresets.json
            /AGENTS.md
            /ReadMe.md

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - name: Install Node binding build dependencies
        working-directory: apps/node
        run: npm ci

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison clang-18 cmake flex gperf libbrotli-dev \
            libcurl4-openssl-dev libegl1-mesa-dev libfontconfig1-dev \
            libfreetype-dev libgles2-mesa-dev libharfbuzz-dev libicu-dev \
            libjpeg-dev libpng-dev libpsl-dev libsqlite3-dev libssl-dev \
            libwebp-dev libwoff-dev libxml2-dev libxslt1-dev lld-18 llvm-18 \
            ninja-build perl python3 ruby xz-utils zlib1g-dev
          clang-18 --version
          ld.lld-18 --version
          llvm-ar-18 --version
          llvm-ranlib-18 --version
          cmake --version
          ninja --version

      # Strictly an optimization — a failed setup leaves the build uncached
      # rather than broken. See windows.yml.
      - name: Set up the compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable the compiler cache
        if: steps.sccache.outcome == 'success'
        run: echo "SHOT_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      - name: Configure ShotKit
        run: |
          free -h
          echo "LTO mode: $SHOT_LTO; compiler launcher: ${SHOT_COMPILER_LAUNCHER:-(none)}"

          # Full LTO merges the whole bitcode graph in one linker process, so
          # lld is serialized to keep the memory peak inside a hosted runner.
          # ThinLTO shards that work and can use real parallelism.
          if [[ "$SHOT_LTO" == "full" ]]; then
            lto_link_flags="-Wl,--threads=1"
          else
            lto_link_flags="-Wl,--thinlto-jobs=2"
          fi

          launcher_args=()
          if [[ -n "${SHOT_COMPILER_LAUNCHER:-}" ]]; then
            launcher_args+=(
              "-DCMAKE_C_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
              "-DCMAKE_CXX_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
            )
          fi

          cmake -S . -B WebKitBuild/shot-linux -G Ninja \
            -DPORT=Shot \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_AR="$(command -v llvm-ar-18)" \
            -DCMAKE_RANLIB="$(command -v llvm-ranlib-18)" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld $lto_link_flags" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld $lto_link_flags" \
            -DSHOT_NODE_API_INCLUDE_DIR="$GITHUB_WORKSPACE/apps/node/node_modules/node-api-headers/include" \
            -DLTO_MODE="$SHOT_LTO" \
            "${launcher_args[@]}"

      - name: Build ShotKit
        run: |
          ninja -C WebKitBuild/shot-linux -j3 shotcli shotnode shot_capi_thread_test
          free -h

      - name: Compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        continue-on-error: true
        run: sccache --show-stats

      - name: Smoke test PNG and WebP
        run: |
          printf '%s\n' '<!doctype html><meta charset=utf-8><style>body{background:#eef2f7;font:32px sans-serif}h1{color:#246}</style><h1>ShotKit CI ✓</h1>' > "$RUNNER_TEMP/shot-smoke.html"
          WebKitBuild/shot-linux/bin/shotcli --html "$RUNNER_TEMP/shot-smoke.html" --out "$RUNNER_TEMP/shot-smoke.png" --width 640 --height 360
          WebKitBuild/shot-linux/bin/shotcli --html "$RUNNER_TEMP/shot-smoke.html" --out "$RUNNER_TEMP/shot-smoke.webp" --format webp --quality 82 --width 640 --height 360
          test "$(stat -c %s "$RUNNER_TEMP/shot-smoke.png")" -gt 100
          test "$(stat -c %s "$RUNNER_TEMP/shot-smoke.webp")" -gt 100

      - name: Verify C ABI thread ownership and native Node SDK
        run: |
          # First isolate initialization, one render and cross-thread free. Run
          # the longer C API soak after the addon tests so either side reports
          # its own failure instead of being hidden behind a bare abort.
          WebKitBuild/shot-linux/bin/shot_capi_thread_test 1
          SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-linux/bin/shot.node" npm test --prefix apps/node
          SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-linux/bin/shot.node" node apps/node/test/native-parity.mjs WebKitBuild/shot-linux/bin/shotcli
          SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-linux/bin/shot.node" node --expose-gc apps/node/test/native-soak.mjs
          WebKitBuild/shot-linux/bin/shot_capi_thread_test 1000

      - uses: actions/setup-node@v4
        if: matrix.arch == 'x64'
        with:
          node-version: 18.18

      - name: Verify the same addon on Node 18.18
        if: matrix.arch == 'x64'
        run: SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-linux/bin/shot.node" node apps/node/test/native-compat.mjs

      - uses: actions/setup-node@v4
        if: matrix.arch == 'x64'
        with:
          node-version: 20

      - name: Verify the same addon on Node 20
        if: matrix.arch == 'x64'
        run: SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-linux/bin/shot.node" node apps/node/test/native-compat.mjs

      - uses: actions/setup-node@v4
        if: matrix.arch == 'x64'
        with:
          node-version: 22

      - name: Verify the same addon on Node 22
        if: matrix.arch == 'x64'
        run: SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-linux/bin/shot.node" node apps/node/test/native-compat.mjs

      - uses: actions/setup-node@v4
        if: matrix.arch == 'x64'
        with:
          node-version: 24

      - name: Verify the same addon on Node 24
        if: matrix.arch == 'x64'
        run: SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-linux/bin/shot.node" node apps/node/test/native-compat.mjs

      - name: Verify scripts are never fetched
        run: |
          python3 tests/fixture_server.py 8988 > "$RUNNER_TEMP/fixture.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8988/reset-counts >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8988/reset-counts >/dev/null
          WebKitBuild/shot-linux/bin/shotcli --url http://127.0.0.1:8988/script-network --out "$RUNNER_TEMP/no-script-network.png" --timeout 5000
          counts=$(curl -fsS http://127.0.0.1:8988/request-counts)
          python3 -c 'import json,sys; counts=json.loads(sys.argv[1]); assert counts == {"/script-network": 1}, counts' "$counts"
          echo "NO-SCRIPT NETWORK PASS: $counts"

      - name: Verify ABI and relocatable CLI
        run: |
          exports=$(llvm-nm-18 -D --defined-only WebKitBuild/shot-linux/lib/libshot.so | awk '{print $3}' | grep '^shot_' | sort)
          test "$(printf '%s\n' "$exports" | grep -c '^shot_')" -eq 10
          readelf -d WebKitBuild/shot-linux/bin/shotcli | grep -F '$ORIGIN/../lib'
          addon_exports=$(llvm-nm-18 -D --defined-only WebKitBuild/shot-linux/bin/shot.node | awk '{print $3}')
          grep -q '^napi_register_module_v1$' <<<"$addon_exports"
          if grep -q '^shot_' <<<"$addon_exports"; then echo 'shot.node leaked C ABI exports' >&2; exit 1; fi
          ls -lh WebKitBuild/shot-linux/lib/libshot.so WebKitBuild/shot-linux/bin/shotcli WebKitBuild/shot-linux/bin/shot.node

      - name: Stage native npm runtime
        run: |
          stage=WebKitBuild/node-runtime
          rm -rf "$stage"
          mkdir -p "$stage"
          cp WebKitBuild/shot-linux/bin/shot.node "$stage/"
          llvm-strip-18 --strip-unneeded "$stage/shot.node"
          ldd "$stage/shot.node" > "$stage/DEPENDENCIES.txt"

      - name: Package release archive
        run: |
          # No version in the name: the archive unpacks to a stable
          # shotkit-linux-<arch>/ directory. The release job stamps the tag onto
          # the file name of the public download.
          name="shotkit-linux-${{ matrix.arch }}"
          stage="WebKitBuild/releases/${name}"
          rm -rf "$stage"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/include"
          cp WebKitBuild/shot-linux/bin/shotcli "$stage/bin/"
          cp WebKitBuild/shot-linux/lib/libshot.so "$stage/lib/"
          cp shot/capi/shot.h "$stage/include/"
          llvm-strip-18 --strip-unneeded "$stage/bin/shotcli" "$stage/lib/libshot.so"
          ldd "$stage/lib/libshot.so" > "$stage/DEPENDENCIES.txt"
          cp ReadMe.md "$stage/README.md"
          tar -C WebKitBuild/releases -cJf "WebKitBuild/releases/${name}.tar.xz" "$name"
          # Record the checksum against the bare file name, not the path it was
          # built at: consumers unpack the artifact somewhere else entirely, and
          # a stored path makes `sha256sum -c` hunt for a directory that is not
          # there. Matches what package-release.ps1 writes on Windows.
          ( cd WebKitBuild/releases && sha256sum "${name}.tar.xz" > "${name}.tar.xz.sha256" )
          archive_bytes=$(stat -c %s "WebKitBuild/releases/${name}.tar.xz")
          echo "release tar.xz: ${archive_bytes} bytes (budget 18000000, lto=${SHOT_LTO})"
          test "$archive_bytes" -le 18000000
          ls -lh "$stage/bin/shotcli" "$stage/lib/libshot.so" "WebKitBuild/releases/${name}.tar.xz"

      - name: Enforce native runtime closure budget
        run: |
          node_bytes=$(stat -c %s WebKitBuild/node-runtime/shot.node)
          cli_bytes=$(( $(stat -c %s WebKitBuild/releases/shotkit-linux-${{ matrix.arch }}/lib/libshot.so) + $(stat -c %s WebKitBuild/releases/shotkit-linux-${{ matrix.arch }}/bin/shotcli) ))
          echo "shot.node closure: $node_bytes bytes; CLI closure: $cli_bytes bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$node_bytes" -le $(( cli_bytes * 105 / 100 ))

      - name: Upload compressed release
        uses: actions/upload-artifact@v7
        with:
          name: shotkit-linux-${{ matrix.arch }}
          path: |
            WebKitBuild/releases/*.tar.xz
            WebKitBuild/releases/*.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload native npm runtime
        uses: actions/upload-artifact@v7
        with:
          name: shotkit-node-linux-${{ matrix.arch }}
          path: WebKitBuild/node-runtime/
          if-no-files-found: error
          retention-days: 7
