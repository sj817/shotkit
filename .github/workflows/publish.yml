name: Publish

# Publish the npm packages tokenlessly via OIDC Trusted Publishing. A vX.Y.Z
# tag triggers the real release; a manual dispatch rehearses by default.
#
# The six engines come from build.yml, called here: it computes the tagged
# tree's engine fingerprint (scripts/ci/fingerprint.mjs) and builds only the
# platforms with no engine-<os>-<arch>-<fingerprint> artifact yet, then
# verifies all six as shipped. A release whose engine inputs did not change
# since the last build -- a version bump, docs, the SDK -- costs the resolve
# and verify jobs and nothing else; force-rebuild rebuilds regardless.
#
# Every published package must carry an npm trusted-publisher binding to this
# repository and this workflow file: @pixel.js/shotkit, its 6 platform
# packages, and @shotkit/node -- the previous name, published beside every
# release as a shim that depends on @pixel.js/shotkit at the same version
# (apps/node/tools/legacy-shim.ts). The old @shotkit/<os>-<arch> platform
# packages are not published any more; nothing depends on them.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: npm publish --dry-run (no registry writes)
        type: boolean
        default: true
      tag:
        description: Existing vX.Y.Z tag to publish (required when dry-run is false)
        type: string
        default: ''
      force-rebuild:
        description: Rebuild the runtimes even if reusable artifacts exist
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release-sha: ${{ steps.context.outputs.sha }}
      tag: ${{ steps.context.outputs.tag }}
    steps:
      - name: Resolve the release context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            sha="$GITHUB_SHA"
          elif [[ "${DRY_RUN:-true}" == "true" ]]; then
            tag=""
            sha="$GITHUB_SHA"
          else
            tag="$INPUT_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
              echo "a valid existing vX.Y.Z tag is required for a real dispatch" >&2
              exit 1
            fi
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release context: tag=${tag:-dry-run}, sha=$sha"

  # The engines at the tagged tree's fingerprint: reused when they exist,
  # built when they do not, and verified on all six platforms either way.
  build:
    needs: resolve
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ needs.resolve.outputs.release-sha }}
      force: ${{ inputs.force-rebuild == true }}
      lto: full

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # gh run download, on the artifact reuse path
      id-token: write # npm Trusted Publishing (OIDC) — tokenless publish
    defaults:
      run:
        working-directory: apps/node
    steps:
      - name: Checkout the node binding
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release-sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/node/
            /scripts/ci/

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5, which supports OIDC publish
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - run: npm ci

      - name: Fetch the native runtimes at this fingerprint
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          FP: ${{ needs.build.outputs.fingerprint }}
        run: |
          names=()
          for os in windows linux macos; do for arch in x64 arm64; do names+=(--name "engine-node-$os-$arch-$FP"); done; done
          node scripts/ci/artifacts.mjs download --require-all "${names[@]}" --dir "$RUNNER_TEMP/runtimes"

      - name: Stage runtimes into platform packages
        shell: bash
        run: |
          staged=0
          while IFS= read -r addon; do
            runtime_dir="$(dirname "$addon")"
            name="$(basename "$runtime_dir")"
            if [[ ! "$name" =~ ^engine-node-(windows|linux|macos)-(x64|arm64)-[0-9a-f]{16}$ ]]; then
              echo "unrecognized native runtime directory: $name" >&2
              exit 1
            fi
            os="${BASH_REMATCH[1]}"; arch="${BASH_REMATCH[2]}"
            case "$os" in
              windows) platform="win32-$arch" ;;
              macos)   platform="darwin-$arch" ;;
              linux)   platform="linux-$arch" ;;
            esac
            npx tsx tools/stage-platform.ts "$platform" "$runtime_dir"
            staged=$((staged + 1))
          done < <(find "$RUNNER_TEMP/runtimes" -type f -name 'shot.node' | sort)
          # All six targets must be present — a missing platform would publish
          # a main package whose optional dependency cannot be resolved.
          if [[ "$staged" -ne 6 ]]; then
            echo "expected 6 staged runtimes, got $staged" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run build

      # The checked-in version is deliberately stale; the version actually
      # published comes from the release tag. A dispatch rehearsal has no tag,
      # so it synthesises one — see below for why that is not a publish hazard.
      - name: Stamp the version being published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if [[ -n "$TAG" ]]; then
            version="${TAG#v}"
            label="release tag '$TAG'"
          else
            # A rehearsal used to keep the checked-in version, which npm
            # rejects outright once anything higher is published — so the
            # rehearsal could never pass, whatever it was actually testing. A
            # safety net that always fails is worse than none: it trains you to
            # read every failure as the known noise. Synthesise a version above
            # the newest release so the rehearsal fails only on real problems.
            latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
              --json tagName --jq '.[0].tagName // empty')"
            latest="${latest#v}"
            latest="${latest:-$(node -p 'require("./package.json").version')}"
            if [[ ! "$latest" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              echo "cannot derive a rehearsal version from '$latest'" >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$(( BASH_REMATCH[3] + 1 ))"
            label="rehearsal version above $latest"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
            echo "$label is not a semver version: '$version'" >&2
            exit 1
          fi
          echo "publishing as $version ($label)"
          npm version "$version" --no-git-tag-version --allow-same-version

      # Aligns every platform package to the main version and injects the
      # exact-pinned optionalDependencies into the manifest being published
      # (the checked-in manifest deliberately omits them; see the script).
      - run: npm run sync-versions

      - name: Publish
        shell: bash
        run: |
          flags=(--access public)
          dry=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.dry-run }}" == "true" ]]; then
            # Rehearsals use a synthetic version above the newest release and
            # never write to npm or create a GitHub Release.
            flags+=(--dry-run)
            dry=true
            echo "dry run — nothing will be published"
          fi
          # Platform packages first so the main package never points at
          # versions that do not exist yet. No NODE_AUTH_TOKEN — OIDC.
          for platform in npm/*/; do
            (cd "$platform" && npm publish "${flags[@]}")
          done
          npm publish "${flags[@]}"

          # The previous name, @shotkit/node, goes out last as a shim that
          # depends on @pixel.js/shotkit at this exact version. It is sent only
          # once the registry serves the package it depends on: a shim that
          # resolves before its target is the same broken install from the
          # other side. Publication can precede visibility by minutes, so this
          # waits rather than assumes. A rehearsal has nothing to wait for.
          version="$(node -p 'require("./package.json").version')"
          if [[ "$dry" == false ]]; then
            code=""
            for attempt in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@pixel.js%2Fshotkit/$version")
              [[ "$code" == 200 ]] && break
              sleep 20
            done
            echo "$code  @pixel.js/shotkit@$version"
            [[ "$code" == 200 ]] || { echo "@pixel.js/shotkit@$version is not visible after 15 minutes; inspect before retrying" >&2; exit 1; }
          fi
          shim="$RUNNER_TEMP/legacy-shim"
          npx tsx tools/legacy-shim.ts "$shim"
          (cd "$shim" && npm publish "${flags[@]}")

  # Attaching the runtimes is what makes the CLI, the C ABI, and the non-Node
  # bindings usable without npm. This is a separate job on purpose: the publish
  # job holds id-token: write for OIDC and should not also hold contents: write.
  assets:
    needs: [resolve, build, publish]
    if: >-
      always()
      && needs.resolve.outputs.tag != ''
      && needs.resolve.result == 'success'
      && needs.publish.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # attach archives to the release and rewrite its body
      actions: read # gh run download, on the artifact reuse path
    steps:
      # At the release commit, not the branch the dispatch ran from: the
      # notes script is part of the release.
      - name: Checkout the release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release-sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release-notes.mjs
            /scripts/ci/

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch the release archives at this fingerprint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FP: ${{ needs.build.outputs.fingerprint }}
        run: |
          names=()
          for os in windows linux macos; do for arch in x64 arm64; do names+=(--name "engine-$os-$arch-$FP"); done; done
          node scripts/ci/artifacts.mjs download --require-all --merge "${names[@]}" --dir "$RUNNER_TEMP/runtimes"

      # The build workflows name archives shotkit-<os>-<arch> with no version, so
      # every archive unpacks into a stable directory. Stamp the tag onto the file
      # name before they become public downloads. The archive bytes are untouched:
      # each one is verified against the checksum CI produced, and that same hash
      # is carried over under the new name.
      - name: Relabel the archives to the release version
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          version="${TAG#v}"
          while IFS= read -r archive; do
            directory="$(dirname "$archive")"
            base="$(basename "$archive" .tar.xz)"
            if [[ ! "$base" =~ -(windows|linux|macos)-(x64|arm64)$ ]]; then
              echo "unrecognized runtime archive: $base" >&2
              exit 1
            fi
            target="shotkit-${version}-${BASH_REMATCH[1]}-${BASH_REMATCH[2]}.tar.xz"
            [[ "$base.tar.xz" == "$target" ]] && continue

            # The build workflows record the checksum against the path they
            # produced it at (WebKitBuild/releases/...), but the archives are
            # downloaded here into a flat temporary directory, so `sha256sum -c`
            # dutifully looks for a path that does not exist and reports the
            # archive as unreadable. Compare the hash column ourselves instead —
            # same verification, no dependency on where the file used to live.
            checksum="${directory}/${base}.tar.xz.sha256"
            hash="$(awk 'NR == 1 { print $1 }' "$checksum")"
            if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
              echo "no usable sha256 in $checksum: '$hash'" >&2
              exit 1
            fi
            actual="$(sha256sum "$archive" | awk '{print $1}')"
            if [[ "$hash" != "$actual" ]]; then
              echo "$base.tar.xz checksum mismatch: expected $hash, got $actual" >&2
              exit 1
            fi
            mv "$archive" "${directory}/${target}"
            rm -f "${directory}/${base}.tar.xz.sha256"
            printf '%s  %s\n' "$hash" "$target" > "${directory}/${target}.sha256"
            echo "$base.tar.xz -> $target"
          done < <(find "$RUNNER_TEMP/runtimes" -type f -name '*.tar.xz' | sort)

      - name: Create or reuse the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release-sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [[ "$draft" != "true" ]]; then
              echo "release $TAG is already public; refusing to overwrite it" >&2
              exit 1
            fi
            echo "reusing existing draft release $TAG"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$RELEASE_SHA" --title "$TAG" \
              --notes "Release preparation is in progress."
          fi

      - name: Attach the runtimes to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mapfile -t files < <(find "$RUNNER_TEMP/runtimes" -type f \
            \( -name '*.tar.xz' -o -name '*.tar.xz.sha256' \) | sort)
          archives=$(printf '%s\n' "${files[@]}" | grep -c '\.tar\.xz$' || true)
          if [[ "$archives" -ne 6 ]]; then
            echo "expected 6 runtime archives, found $archives" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      # Generated from the archives actually attached above, so the sizes and
      # checksums in the notes cannot drift from the assets.
      - name: Rewrite the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName \
            --jq "[.[].tagName] | map(select(. != \"$TAG\")) | .[0] // empty")
          range=()
          changes="$RUNNER_TEMP/changes.md"
          if [[ -n "$previous" ]]; then
            range=(--previous "$previous")
            gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$TAG" --paginate \
              --jq '.commits[].commit.message | split("\n")[0] | "- " + .' > "$changes"
          else
            printf '%s\n' '- Initial release.' > "$changes"
          fi
          node scripts/release-notes.mjs \
            --tag "$TAG" --dir "$RUNNER_TEMP/runtimes" --repo "$GITHUB_REPOSITORY" \
            --changes "$changes" "${range[@]}" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish the complete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
