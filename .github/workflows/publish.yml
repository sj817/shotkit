name: Publish

# Publish the npm packages tokenlessly via OIDC Trusted Publishing. Trigger by
# publishing a GitHub Release (tag vX.Y.Z), or run manually with dry-run to
# rehearse without touching the registry.
#
# The six platform runtimes are NOT rebuilt when the tagged commit already has
# successful Windows/Linux/macOS runs whose artifacts are still live — a release
# then costs minutes instead of the ~2 hours a full three-platform rebuild takes.
# Rebuilding is the automatic fallback when any artifact is missing or expired,
# and can be forced with the force-rebuild input.
#
# Every published package (@shotkit/node + 6 platform packages) must carry an
# npm trusted-publisher binding to this repository and this workflow file.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: npm publish --dry-run (no registry writes)
        type: boolean
        default: true
      force-rebuild:
        description: Rebuild the runtimes even if reusable artifacts exist
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
      run-ids: ${{ steps.find.outputs.run-ids }}
    steps:
      - name: Look for reusable runtime artifacts
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          FORCE_REBUILD: ${{ inputs.force-rebuild }}
        run: |
          set -euo pipefail

          if [[ "${FORCE_REBUILD:-false}" == "true" ]]; then
            echo "force-rebuild requested — building from source"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every artifact the publish job needs, and the workflow that makes it.
          expected="shotkit-windows-x64 shotkit-windows-arm64
                    shotkit-linux-x64 shotkit-linux-arm64
                    shotkit-macos-x64 shotkit-macos-arm64"

          # Branch matters as much as commit: a tag and a throwaway branch can
          # point at the same SHA, and a manual run there (a different LTO mode,
          # an experiment) must never become the source of a published binary.
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          echo "reusing only from $branch builds of $SHA"

          # The branch query parameter does the filtering server-side; the
          # select() repeats it locally so a silently ignored parameter cannot
          # widen the search back to every branch.
          newest_run=".workflow_runs
            | map(select(.head_branch == \"$branch\"))
            | sort_by(.run_started_at) | reverse | .[0].id // empty"

          run_ids=()
          for workflow in windows.yml linux.yml macos.yml; do
            id=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SHA&status=success&branch=$branch&per_page=50" \
              --jq "$newest_run")
            if [[ -z "$id" ]]; then
              echo "no successful $workflow run for $SHA on $branch — building from source"
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$workflow -> run $id"
            run_ids+=("$id")
          done

          available=""
          for id in "${run_ids[@]}"; do
            available+=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
              --jq '.artifacts[] | select(.expired == false) | .name')$'\n'
          done

          for want in $expected; do
            if ! grep -qx -- "$want" <<<"$available"; then
              echo "artifact $want is missing or expired — building from source"
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "reusing runtimes from runs: ${run_ids[*]}"
          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "run-ids=${run_ids[*]}" >> "$GITHUB_OUTPUT"

  windows:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    uses: ./.github/workflows/windows.yml
  linux:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    uses: ./.github/workflows/linux.yml
  macos:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    uses: ./.github/workflows/macos.yml

  publish:
    needs: [resolve, windows, linux, macos]
    # The three build jobs are skipped on the reuse path; only a genuine
    # failure or cancellation should stop the publish.
    if: >-
      always()
      && needs.resolve.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # gh run download, on the artifact reuse path
      id-token: write # npm Trusted Publishing (OIDC) — tokenless publish
    defaults:
      run:
        working-directory: Source/WebKitShot/bindings/node
    steps:
      - name: Checkout the node binding
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Source/WebKitShot/bindings/node/

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5, which supports OIDC publish
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: Source/WebKitShot/bindings/node/package-lock.json

      - name: Download runtime archives from this run
        if: needs.resolve.outputs.reuse != 'true'
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/runtimes
          pattern: shotkit-*
          merge-multiple: true

      - name: Download runtime archives from the tagged commit's builds
        if: needs.resolve.outputs.reuse == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ needs.resolve.outputs.run-ids }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtimes"
          for id in $RUN_IDS; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" \
              --pattern 'shotkit-*' --dir "$RUNNER_TEMP/runtimes"
          done

      - run: npm ci

      - name: Stage runtimes into platform packages
        shell: bash
        run: |
          # Archives land flat from download-artifact and one directory deep
          # from gh run download, so locate them rather than globbing a level.
          staged=0
          while IFS= read -r archive; do
            name="$(basename "$archive" .tar.xz)"
            if [[ ! "$name" =~ -(windows|linux|macos)-(x64|arm64)$ ]]; then
              echo "unrecognized runtime archive: $name" >&2
              exit 1
            fi
            os="${BASH_REMATCH[1]}"; arch="${BASH_REMATCH[2]}"
            case "$os" in
              windows) platform="win32-$arch" ;;
              macos)   platform="darwin-$arch" ;;
              linux)   platform="linux-$arch" ;;
            esac
            # Each archive holds a single top-level directory named after it;
            # unpack beside the archive so both download layouts resolve.
            extracted="$(dirname "$archive")/$name"
            tar -xJf "$archive" -C "$(dirname "$archive")"
            npx tsx tools/stage-platform.ts "$platform" "$extracted"
            staged=$((staged + 1))
          done < <(find "$RUNNER_TEMP/runtimes" -type f -name '*.tar.xz' | sort)
          # All six targets must be present — a missing platform would publish
          # a main package whose optional dependency cannot be resolved.
          if [[ "$staged" -ne 6 ]]; then
            echo "expected 6 staged runtimes, got $staged" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run build

      - name: Stamp the release version
        if: github.event_name == 'release'
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
            echo "release tag '$tag' is not a semver version" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      # Aligns every platform package to the main version and injects the
      # exact-pinned optionalDependencies into the manifest being published
      # (the checked-in manifest deliberately omits them; see the script).
      - run: npm run sync-versions

      - name: Publish
        shell: bash
        run: |
          flags=(--access public)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry-run }}" == "true" ]]; then
            flags+=(--dry-run)
            echo "dry run — nothing will be published"
          fi
          # Platform packages first so the main package never points at
          # versions that do not exist yet. No NODE_AUTH_TOKEN — OIDC.
          for platform in npm/*/; do
            (cd "$platform" && npm publish "${flags[@]}")
          done
          npm publish "${flags[@]}"

  # Attaching the runtimes is what makes the CLI, the C ABI, and the non-Node
  # bindings usable without npm. This is a separate job on purpose: the publish
  # job holds id-token: write for OIDC and should not also hold contents: write.
  assets:
    needs: [resolve, windows, linux, macos]
    if: >-
      always()
      && github.event_name == 'release'
      && needs.resolve.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # attach archives to the release and rewrite its body
      actions: read # gh run download, on the artifact reuse path
    steps:
      - name: Checkout the release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Source/WebKitShot/tools/release-notes.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download runtime archives from this run
        if: needs.resolve.outputs.reuse != 'true'
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/runtimes
          pattern: shotkit-*
          merge-multiple: true

      - name: Download runtime archives from the tagged commit's builds
        if: needs.resolve.outputs.reuse == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ needs.resolve.outputs.run-ids }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtimes"
          for id in $RUN_IDS; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" \
              --pattern 'shotkit-*' --dir "$RUNNER_TEMP/runtimes"
          done

      - name: Attach the runtimes to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -t files < <(find "$RUNNER_TEMP/runtimes" -type f \
            \( -name '*.tar.xz' -o -name '*.tar.xz.sha256' \) | sort)
          archives=$(printf '%s\n' "${files[@]}" | grep -c '\.tar\.xz$' || true)
          if [[ "$archives" -ne 6 ]]; then
            echo "expected 6 runtime archives, found $archives" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      # Generated from the archives actually attached above, so the sizes and
      # checksums in the notes cannot drift from the assets.
      - name: Rewrite the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName \
            --jq "[.[].tagName] | map(select(. != \"$TAG\")) | .[0] // empty")
          range=()
          if [[ -n "$previous" ]]; then range=(--previous "$previous"); fi
          node Source/WebKitShot/tools/release-notes.mjs \
            --tag "$TAG" --dir "$RUNNER_TEMP/runtimes" --repo "$GITHUB_REPOSITORY" \
            "${range[@]}" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
