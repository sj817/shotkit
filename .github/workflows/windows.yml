name: Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.githooks/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.githooks/**'
  workflow_dispatch:
    inputs:
      lto:
        description: Link-time optimization mode
        type: choice
        options: [full, thin]
        default: full
  workflow_call:
    inputs:
      lto:
        description: Link-time optimization mode
        type: string
        default: full

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            triplet: x64-windows-webkit
            experimental: false
          - arch: arm64
            runner: windows-11-arm
            triplet: arm64-windows-webkit
            experimental: false

    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 360

    env:
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      # Full LTO stays the shipped profile. Measured against ThinLTO on the
      # same commit it is 3.6-4.5% smaller across all four targets, and it
      # costs nothing in wall clock: the build is dominated by compiling ~2400
      # translation units, not by the link, and full LTO's compile phase emits
      # bitcode instead of machine code, which offsets its slower link.
      SHOT_LTO: ${{ inputs.lto || 'full' }}
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Checkout the ShotKit build closure
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /Source/
            /shot/
            /scripts/
            /tests/
            /Tools/
            /WebKitLibraries/
            /CMakeLists.txt
            /CMakePresets.json
            /vcpkg.json
            /vcpkg-configuration.json
            /AGENTS.md
            /ReadMe.md

      - name: Cache vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-windows-shot-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'WebKitLibraries/ports/**', format('WebKitLibraries/triplets/{0}.cmake', matrix.triplet)) }}

      # sccache turns the ~85 minute cold compile into a mostly-cached one when
      # only ShotKit sources moved. It is strictly an optimization: if the setup
      # fails (no prebuilt binary for this runner arch, cache service outage),
      # the build still runs, just uncached.
      - name: Set up the compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable the compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: echo "SHOT_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      - name: Ensure the arm64 host toolchain
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          # The windows-11-arm hosted image carries fewer preinstalled tools
          # than windows-2022; install anything the WebKit build needs that is
          # missing. x64 tools run under emulation where no arm64 build exists.
          # choco 装出来的东西未必落在当前 shell 的 PATH 上（clang-cl 在 LLVM\bin，
          # perl 在 Strawberry\perl\bin），所以探测与重试校验都要带上这些目录。
          function Update-ToolPath {
            $dirs = @(
              'C:\Program Files\LLVM\bin',
              'C:\Strawberry\perl\bin',
              'C:\Program Files\CMake\bin'
            ) + @(Get-ChildItem 'C:\tools\ruby*\bin' -ErrorAction SilentlyContinue | ForEach-Object FullName)
            $env:Path = (@([Environment]::GetEnvironmentVariable('Path', 'Machine'),
                           [Environment]::GetEnvironmentVariable('Path', 'User')) +
                         @($dirs | Where-Object { Test-Path $_ })) -join ';'
            return $dirs
          }
          $packageExe = @{ llvm = 'clang-cl.exe'; ruby = 'ruby.exe'; strawberryperl = 'perl.exe'
                           cmake = 'cmake.exe'; ninja = 'ninja.exe' }
          Update-ToolPath | Out-Null
          $missing = @($packageExe.Keys | Where-Object {
            -not (Get-Command $packageExe[$_] -ErrorAction SilentlyContinue)
          })
          # community.chocolatey.org 会间歇性 503。choco 在单个包失败时仍以 0 退出
          # （2026-08-15 实测日志写着「Chocolatey installed 1/1 packages」），所以重试
          # 必须按「包是否真的装上」判定，不能看退出码。
          for ($attempt = 1; $missing -and $attempt -le 3; $attempt++) {
            if ($attempt -gt 1) { Start-Sleep -Seconds (20 * $attempt) }
            choco install @missing -y --no-progress
            Update-ToolPath | Out-Null
            $missing = @($missing | Where-Object {
              -not (Get-Command $packageExe[$_] -ErrorAction SilentlyContinue)
            })
          }
          if ($missing) { throw "choco 连续 3 次未能装上：$($missing -join ', ')" }
          foreach ($candidate in Update-ToolPath) {
            if (Test-Path $candidate) { $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }

      - name: Install parser generator tools
        shell: pwsh
        run: |
          # 同上：按产物判定重试。2026-08-15 这里真的被 503 拦过——gperf 装上了、
          # winflexbison3 没有，choco 照样退 0，直到下面 Get-Command win_bison.exe 才炸。
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if ((Get-Command gperf.exe -ErrorAction SilentlyContinue) -and
                (Get-Command win_bison.exe -ErrorAction SilentlyContinue) -and
                (Get-Command win_flex.exe -ErrorAction SilentlyContinue)) { break }
            if ($attempt -gt 1) { Start-Sleep -Seconds (20 * $attempt) }
            choco install gperf winflexbison3 -y --no-progress
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
                        [Environment]::GetEnvironmentVariable('Path', 'User')
          }
          # gperf 没有同等的上游 Release 可回落；显式报错好过让 CMake 在几分钟后
          # 以「Could NOT find Gperf (missing: GPERF_EXECUTABLE)」结尾。
          if (-not (Get-Command gperf.exe -ErrorAction SilentlyContinue)) {
            throw 'choco 连续 3 次未能装上 gperf（community.chocolatey.org 故障？）'
          }
          $shim = Join-Path $env:RUNNER_TEMP 'webkit-tools'
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          if ((Get-Command win_bison.exe -ErrorAction SilentlyContinue) -and
              (Get-Command win_flex.exe -ErrorAction SilentlyContinue)) {
            Copy-Item (Get-Command win_bison.exe).Source (Join-Path $shim 'bison.exe')
            Copy-Item (Get-Command win_flex.exe).Source (Join-Path $shim 'flex.exe')
          } else {
            # 回落到上游 Release。2026-08-15 community.chocolatey.org 连续 503/504 挂了
            # 一个多小时，跨掉两轮 CI，重试完全无效。choco 的 winflexbison3 包本身就是
            # 转包 lexxmark/winflexbison 的 Release 产物，直接取源头少一个故障域。
            # 版本与 SHA256 都钉死；bison 靠可执行文件所在目录找 m4 骨架，所以整包解压
            # 到 shim 目录后就地改名，让 data/ 与 bison.exe 同级。
            Write-Host '::warning::chocolatey 未能提供 win_flex/win_bison，回落到 lexxmark/winflexbison Release'
            $zip = Join-Path $env:RUNNER_TEMP 'win_flex_bison.zip'
            $url = 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip'
            $expected = '8D324B62BE33604B2C45AD1DD34AB93D722534448F55A16CA7292DE32B6AC135'
            Invoke-WebRequest -Uri $url -OutFile $zip
            $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
            if ($actual -ne $expected) { throw "win_flex_bison-2.5.25.zip 校验失败：期望 $expected，实得 $actual" }
            Expand-Archive -LiteralPath $zip -DestinationPath $shim -Force
            Copy-Item (Join-Path $shim 'win_bison.exe') (Join-Path $shim 'bison.exe')
            Copy-Item (Join-Path $shim 'win_flex.exe') (Join-Path $shim 'flex.exe')
          }
          $shim | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $shim 'bison.exe') --version | Select-Object -First 1
          & (Join-Path $shim 'flex.exe') --version
          ruby --version
          perl --version
          python --version
          cmake --version
          ninja --version
          clang-cl --version

      - name: Install native dependencies
        shell: pwsh
        run: |
          $vcpkgCommand = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
          if ($vcpkgCommand) {
            $vcpkgExe = $vcpkgCommand.Source
          } else {
            # The arm64 hosted image may not preinstall vcpkg; bootstrap a copy.
            $vcpkgClone = Join-Path $env:RUNNER_TEMP 'vcpkg'
            git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgClone
            if ($LASTEXITCODE) { throw "vcpkg clone failed with exit code $LASTEXITCODE" }
            & (Join-Path $vcpkgClone 'bootstrap-vcpkg.bat') -disableMetrics
            if ($LASTEXITCODE) { throw "vcpkg bootstrap failed with exit code $LASTEXITCODE" }
            $vcpkgExe = Join-Path $vcpkgClone 'vcpkg.exe'
          }
          $vcpkgRoot = Split-Path $vcpkgExe -Parent
          $installed = Join-Path $env:GITHUB_WORKSPACE 'WebKitBuild\vcpkg_installed'
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$binaryCache,readwrite"

          & $vcpkgExe install `
            --x-manifest-root=$env:GITHUB_WORKSPACE `
            --x-install-root=$installed `
            --triplet=${{ matrix.triplet }} `
            --overlay-triplets="$env:GITHUB_WORKSPACE\WebKitLibraries\triplets" `
            --x-feature=web `
            --x-feature=skia `
            --x-feature=woff2 `
            --clean-after-build `
            --no-print-usage
          if ($LASTEXITCODE) { throw "vcpkg failed with exit code $LASTEXITCODE" }

          # The WebKitRequirements ICU CMake port installs a prebuilt full data
          # blob, so ICU_DATA_FILTER_FILE is not consumed. Rebuild only the data
          # DLL deterministically from the pinned upstream archive instead.
          $icuArchive = Join-Path $vcpkgRoot 'downloads\icu4c-77_1-src.tgz'
          if (-not (Test-Path $icuArchive)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $icuArchive) | Out-Null
            Invoke-WebRequest `
              -Uri 'https://github.com/unicode-org/icu/releases/download/release-77-1/icu4c-77_1-src.tgz' `
              -OutFile $icuArchive
          }
          $expectedIcuSha512 = 'a47d6d9c327d037a05ea43d1d1a06b2fd757cc02a94f7c1a238f35cfc3dfd4ab78d0612790f3a3cca0292c77412a9c2c15c8f24b718f79a857e007e66f07e7cd'
          $actualIcuSha512 = (Get-FileHash $icuArchive -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actualIcuSha512 -ne $expectedIcuSha512) { throw 'ICU source archive SHA-512 mismatch' }

          $icuSource = Join-Path $env:RUNNER_TEMP 'shotkit-icu-source'
          Remove-Item $icuSource -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $icuSource | Out-Null
          & tar.exe -xzf $icuArchive -C $icuSource 'icu/source/data/in/icudt77l.dat'
          if ($LASTEXITCODE) { throw "ICU source extraction failed with exit code $LASTEXITCODE" }
          $icuDat = Join-Path $icuSource 'icu\source\data\in\icudt77l.dat'
          pwsh scripts/slim-icu.ps1 `
            -Root $env:GITHUB_WORKSPACE `
            -VcpkgRoot $vcpkgRoot `
            -VcpkgInstalledDir $installed `
            -VcpkgTriplet ${{ matrix.triplet }} `
            -DatPath $icuDat `
            -PruneUnusedConverters
          if ($LASTEXITCODE) { throw "ICU slimming failed with exit code $LASTEXITCODE" }

          $icuData = Get-ChildItem "$installed\${{ matrix.triplet }}\bin\icudt*.dll" | Where-Object Name -NotLike '*.orig.dll' | Select-Object -First 1
          if (-not $icuData) { throw 'vcpkg did not install an ICU data DLL' }
          if ($icuData.Length -gt 5000000) { throw "slim ICU data exceeds 5,000,000 bytes: $($icuData.Length) bytes" }
          Write-Host "slim ICU data: $($icuData.Length) bytes"

          "SHOT_VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHOT_VCPKG_INSTALLED=$installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Save vcpkg binary packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-windows-shot-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'WebKitLibraries/ports/**', format('WebKitLibraries/triplets/{0}.cmake', matrix.triplet)) }}

      - name: Configure and build ShotKit
        shell: pwsh
        run: |
          $computer = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          $pageFiles = Get-CimInstance Win32_PageFileUsage
          Write-Host ("physical memory: {0:N1} MiB; free virtual memory: {1:N1} MiB" -f ($computer.TotalPhysicalMemory / 1MB), ($os.FreeVirtualMemory / 1KB))
          $pageFiles | Format-Table Name, AllocatedBaseSize, CurrentUsage, PeakUsage
          Write-Host "LTO mode: $env:SHOT_LTO; compiler launcher: $(if ($env:SHOT_COMPILER_LAUNCHER) { $env:SHOT_COMPILER_LAUNCHER } else { '(none)' })"

          $buildArguments = @(
            'scripts/build-shot.ps1',
            '-Configure', '-Build',
            '-Root', $env:GITHUB_WORKSPACE,
            '-VcpkgRoot', $env:SHOT_VCPKG_ROOT,
            '-VcpkgInstalledDir', $env:SHOT_VCPKG_INSTALLED,
            '-Arch', '${{ matrix.arch }}',
            '-VcpkgTriplet', '${{ matrix.triplet }}',
            '-LtoMode', $env:SHOT_LTO,
            '-Jobs', '3'
          )
          if ($env:SHOT_LTO -eq 'full') {
            # Full LTO merges the whole bitcode graph in one linker process;
            # serializing lld keeps the memory peak inside a hosted runner.
            $buildArguments += @('-LinkThreads', '1')
          } else {
            $buildArguments += @('-LtoJobs', '2')
          }
          if ($env:SHOT_COMPILER_LAUNCHER) {
            $buildArguments += @('-CompilerLauncher', $env:SHOT_COMPILER_LAUNCHER)
          }
          pwsh @buildArguments
          if ($LASTEXITCODE) { throw "ShotKit build failed with exit code $LASTEXITCODE" }

      - name: Compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: sccache --show-stats

      - name: Smoke test PNG and WebP
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE 'WebKitBuild\shot\bin'
          $html = Join-Path $env:RUNNER_TEMP 'shot-smoke.html'
          $png = Join-Path $env:RUNNER_TEMP 'shot-smoke.png'
          $webp = Join-Path $env:RUNNER_TEMP 'shot-smoke.webp'
          '<!doctype html><meta charset=utf-8><style>body{background:#eef2f7;font:32px sans-serif}h1{color:#246}</style><h1>ShotKit CI ✓</h1>' | Set-Content -LiteralPath $html -Encoding utf8NoBOM
          & (Join-Path $bin 'shotcli.exe') --html $html --out $png --width 640 --height 360
          if ($LASTEXITCODE) { throw "PNG smoke failed with exit code $LASTEXITCODE" }
          & (Join-Path $bin 'shotcli.exe') --html $html --out $webp --format webp --quality 82 --width 640 --height 360
          if ($LASTEXITCODE) { throw "WebP smoke failed with exit code $LASTEXITCODE" }
          if ((Get-Item $png).Length -lt 100 -or (Get-Item $webp).Length -lt 100) { throw 'encoded image is unexpectedly small' }

      - name: Verify scripts are never fetched
        shell: pwsh
        run: pwsh tests/verify_no_script_network.ps1 -BuildDir "$env:GITHUB_WORKSPACE\WebKitBuild\shot" -VcpkgTriplet ${{ matrix.triplet }}

      - name: Verify the C ABI export surface
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          $hostArch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Host$hostArch\$hostArch\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $dll = Join-Path $env:GITHUB_WORKSPACE 'WebKitBuild\shot\bin\shot.dll'
          $exports = @(& $dumpbin /EXPORTS $dll | Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(shot_\S+)\s*$')
          if ($exports.Count -ne 10) { throw "expected 10 shot_* exports, found $($exports.Count)" }
          Get-Item $dll, (Join-Path (Split-Path $dll) 'shotcli.exe') | Format-Table Name, Length

      - name: Package release archive
        shell: pwsh
        run: |
          $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          pwsh scripts/package-release.ps1 `
            -Root $env:GITHUB_WORKSPACE `
            -Version $version `
            -LtoMode $env:SHOT_LTO `
            -Architecture ${{ matrix.arch }} `
            -VcpkgTriplet ${{ matrix.triplet }} `
            -MaxPackageBytes 22000000

      - name: Upload compressed release
        uses: actions/upload-artifact@v7
        with:
          name: shotkit-windows-${{ matrix.arch }}
          path: |
            WebKitBuild/releases/*.tar.xz
            WebKitBuild/releases/*.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
