# Builds the linux engines and uploads them under the engine
# fingerprint: engine-linux-<arch>-<fingerprint> (the release archive)
# and engine-node-linux-<arch>-<fingerprint> (the addon closure). Called
# by build.yml for the architectures whose artifacts are missing; the
# dispatch form builds by hand. Tests that need the SDK run in build.yml's
# verify job against these artifacts, on every run, whether or not anything
# was built here.
#
# No push trigger and no concurrency group: build.yml is the entry point
# and owns both. A called workflow that shared a group with its caller
# would cancel or deadlock itself.
name: build-linux

on:
  workflow_call:
    inputs:
      archs:
        description: 'JSON list of the architectures to build, e.g. ["x64","arm64"]'
        type: string
        default: '["x64","arm64"]'
      fingerprint:
        description: the engine fingerprint the artifacts are named after; computed here when empty
        type: string
        default: ''
      lto:
        description: Link-time optimization mode
        type: string
        default: full
      ref:
        description: the commit to build; empty builds the triggering ref
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      archs:
        description: architectures to build
        type: choice
        options: ['["x64","arm64"]', '["x64"]', '["arm64"]']
        default: '["x64","arm64"]'
      lto:
        description: Link-time optimization mode
        type: choice
        options: [full, thin]
        default: full

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: "build: linux-${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      # See windows.yml: full LTO measured smaller at no wall-clock cost, so it
      # stays the shipped profile; thin remains available through the input.
      SHOT_LTO: ${{ inputs.lto || 'full' }}
      SHOT_COMPILER_LAUNCHER: ccache
      # ccache, persisted as the ccache-<os>-<arch> artifact between runs.
      # Not the Actions cache: that evicted everything after seven idle days
      # and kept a pull request's entries invisible to main, so the first
      # build after any quiet week was cold. direct + depend mode means a hit
      # never runs the preprocessor, which is what made sccache's warm
      # compile still take nine minutes here.
      # CCACHE_DIR is set by the unpack step: the runner context is not
      # available in a job's env.
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_DEPEND: '1'
      CCACHE_NOHASHDIR: '1'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      # libshot's full LTO link is the memory peak of the job; keep links
      # serial, especially on the smaller arm64 host.
      WEBKIT_NINJA_LINK_MAX: '1'

    steps:
      - name: Checkout the ShotKit build closure
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /Source/
            /shot/
            /apps/node/
            /scripts/
            /tests/
            /Tools/
            /CMakeLists.txt
            /CMakePresets.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - name: Engine fingerprint
        id: fingerprint
        shell: bash
        env:
          FROM_CALLER: ${{ inputs.fingerprint }}
          LTO: ${{ inputs.lto || 'full' }}
        # The caller computed it for the tree it is building; a dispatch
        # computes it here. Either way it names this run's artifacts.
        run: |
          if [ -n "$FROM_CALLER" ]; then echo "fingerprint=$FROM_CALLER" >> "$GITHUB_OUTPUT"; echo "$FROM_CALLER (from the caller)"; else node scripts/ci/fingerprint.mjs --lto "$LTO" --output; fi

      - name: Install Node binding build dependencies
        working-directory: apps/node
        run: npm ci

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison ccache clang-18 cmake flex gperf libbrotli-dev \
            libcurl4-openssl-dev libegl1-mesa-dev libfontconfig1-dev \
            libfreetype-dev libgles2-mesa-dev libharfbuzz-dev libicu-dev \
            libjpeg-dev libpng-dev libpsl-dev libsqlite3-dev libssl-dev \
            libwebp-dev libwoff-dev libxml2-dev libxslt1-dev lld-18 llvm-18 \
            ninja-build perl python3 ruby xz-utils zlib1g-dev
          clang-18 --version
          ld.lld-18 --version
          llvm-ar-18 --version
          llvm-ranlib-18 --version
          cmake --version
          ninja --version
          ccache --version | head -1

      - name: Restore the compiler cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/artifacts.mjs download --name ccache-linux-${{ matrix.arch }} --dir "$RUNNER_TEMP/ccache-dl"

      - name: Unpack the compiler cache
        shell: bash
        # GNU tar under Git Bash reads D:\ as a host name, so paths go
        # through cygpath where it exists.
        run: |
          tmp="$RUNNER_TEMP"; command -v cygpath >/dev/null 2>&1 && tmp="$(cygpath "$RUNNER_TEMP")"
          mkdir -p "$tmp/ccache"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          mkdir -p "$tmp/ccache-dl"
          tarball="$(find "$tmp/ccache-dl" -name ccache.tar | head -1)"
          if [ -n "$tarball" ]; then tar -xf "$tarball" -C "$tmp"; echo "restored $(du -sh "$tmp/ccache" | cut -f1)"; else echo "no compiler cache yet: cold"; fi
          ccache -z
          ccache -p | grep -E '^\(environment\)' || true

      - name: Configure ShotKit
        run: |
          free -h
          echo "LTO mode: $SHOT_LTO; compiler launcher: ${SHOT_COMPILER_LAUNCHER:-(none)}"

          # Full LTO merges the whole bitcode graph in one linker process, so
          # lld is serialized to keep the memory peak inside a hosted runner.
          # ThinLTO shards that work and can use real parallelism.
          if [[ "$SHOT_LTO" == "full" ]]; then
            lto_link_flags="-Wl,--threads=1"
          else
            lto_link_flags="-Wl,--thinlto-jobs=2"
          fi

          launcher_args=()
          if [[ -n "${SHOT_COMPILER_LAUNCHER:-}" ]]; then
            launcher_args+=(
              "-DCMAKE_C_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
              "-DCMAKE_CXX_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
            )
          fi

          cmake -S . -B WebKitBuild/shot-linux -G Ninja \
            -DPORT=Shot \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_AR="$(command -v llvm-ar-18)" \
            -DCMAKE_RANLIB="$(command -v llvm-ranlib-18)" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld $lto_link_flags" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld $lto_link_flags" \
            -DSHOT_NODE_API_INCLUDE_DIR="$GITHUB_WORKSPACE/apps/node/node_modules/node-api-headers/include" \
            -DLTO_MODE="$SHOT_LTO" \
            "${launcher_args[@]}"

      - name: Build ShotKit
        id: build
        run: |
          ninja -C WebKitBuild/shot-linux -j3 shotcli shotnode shot_capi_thread_test
          free -h

      - name: Compiler cache statistics
        id: ccache-stats
        if: always() && steps.build.outcome != 'skipped'
        shell: bash
        run: |
          ccache --cleanup
          ccache -s -v | tee -a "$GITHUB_STEP_SUMMARY"
          misses=$(ccache --print-stats | awk -F'\t' '$1=="cache_miss"{print $2}')
          echo "misses=${misses:-0}" >> "$GITHUB_OUTPUT"

      # Only when the cache gained something, and never from a fork's pull
      # request (its upload would not be trusted anyway).
      - name: Pack the compiler cache
        id: ccache-pack
        if: always() && steps.ccache-stats.outputs.misses != '0' && steps.ccache-stats.outputs.misses != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          tmp="$RUNNER_TEMP"; command -v cygpath >/dev/null 2>&1 && tmp="$(cygpath "$RUNNER_TEMP")"
          rm -rf "$tmp/ccache-dl"
          tar -cf "$tmp/ccache.tar" -C "$tmp" ccache
          ls -l "$tmp/ccache.tar"
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save the compiler cache
        if: always() && steps.ccache-pack.outputs.save == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ccache-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/ccache.tar
          compression-level: 0
          retention-days: 90
          overwrite: true

      # The SDK suite, parity, soak, the Node 18-24 compatibility loop and the
      # network fixture run in build.yml's verify job against the uploaded
      # artifacts; only the C ABI ownership test stays here, since it is not
      # shipped.
      - name: Verify C ABI thread ownership
        run: |
          WebKitBuild/shot-linux/bin/shot_capi_thread_test 1
          WebKitBuild/shot-linux/bin/shot_capi_thread_test 1000

      - name: Verify ABI and relocatable CLI
        run: |
          exports=$(llvm-nm-18 -D --defined-only WebKitBuild/shot-linux/lib/libshot.so | awk '{print $3}' | grep '^shot_' | sort)
          test "$(printf '%s\n' "$exports" | grep -c '^shot_')" -eq 10
          readelf -d WebKitBuild/shot-linux/bin/shotcli | grep -F '$ORIGIN/../lib'
          addon_exports=$(llvm-nm-18 -D --defined-only WebKitBuild/shot-linux/bin/shot.node | awk '{print $3}')
          grep -q '^napi_register_module_v1$' <<<"$addon_exports"
          if grep -q '^shot_' <<<"$addon_exports"; then echo 'shot.node leaked C ABI exports' >&2; exit 1; fi
          ls -lh WebKitBuild/shot-linux/lib/libshot.so WebKitBuild/shot-linux/bin/shotcli WebKitBuild/shot-linux/bin/shot.node

      - name: Stage native npm runtime
        run: |
          # shot.node is a thin addon over libshot.so, which travels with it
          # under lib/ (RPATH $ORIGIN/lib).
          stage=WebKitBuild/node-runtime
          rm -rf "$stage"
          mkdir -p "$stage/lib"
          cp WebKitBuild/shot-linux/bin/shot.node "$stage/"
          cp WebKitBuild/shot-linux/lib/libshot.so "$stage/lib/"
          llvm-strip-18 --strip-unneeded "$stage/shot.node" "$stage/lib/libshot.so"
          ldd "$stage/shot.node" > "$stage/DEPENDENCIES.txt"
          grep -F "$stage/lib/libshot.so" "$stage/DEPENDENCIES.txt" || { echo 'shot.node does not resolve libshot.so from lib/ next to it' >&2; cat "$stage/DEPENDENCIES.txt"; exit 1; }

      - name: Package release archive
        run: |
          # No version in the name: the archive unpacks to a stable
          # shotkit-linux-<arch>/ directory. The release job stamps the tag onto
          # the file name of the public download.
          name="shotkit-linux-${{ matrix.arch }}"
          stage="WebKitBuild/releases/${name}"
          rm -rf "$stage"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/include"
          cp WebKitBuild/shot-linux/bin/shotcli "$stage/bin/"
          cp WebKitBuild/shot-linux/lib/libshot.so "$stage/lib/"
          cp shot/capi/shot.h "$stage/include/"
          llvm-strip-18 --strip-unneeded "$stage/bin/shotcli" "$stage/lib/libshot.so"
          ldd "$stage/lib/libshot.so" > "$stage/DEPENDENCIES.txt"
          # A generated README, not the repository's: the archive is reused
          # across releases by fingerprint, and a README copied from the
          # tree would go stale without changing the fingerprint.
          {
            echo "ShotKit - Linux ${{ matrix.arch }}"
            echo
            echo "Static HTML/CSS screenshot kernel. Page JavaScript and WebAssembly are disabled."
            echo "Extract the complete archive before use; the downloaded file name carries the"
            echo "release version, the directory it unpacks into does not."
            echo
            echo "CLI:"
            echo "  bin/shotcli --url https://example.com --out example.png"
            echo "  bin/shotcli --html page.html --out page.webp --format webp"
            echo
            echo "C ABI:"
            echo "  Header: include/shot.h"
            echo "  Library: lib/libshot.so"
          } > "$stage/README.txt"
          tar -C WebKitBuild/releases -cJf "WebKitBuild/releases/${name}.tar.xz" "$name"
          # Record the checksum against the bare file name, not the path it was
          # built at: consumers unpack the artifact somewhere else entirely, and
          # a stored path makes `sha256sum -c` hunt for a directory that is not
          # there. Matches what package-release.ps1 writes on Windows.
          ( cd WebKitBuild/releases && sha256sum "${name}.tar.xz" > "${name}.tar.xz.sha256" )
          archive_bytes=$(stat -c %s "WebKitBuild/releases/${name}.tar.xz")
          echo "release tar.xz: ${archive_bytes} bytes (budget 18000000, lto=${SHOT_LTO})"
          test "$archive_bytes" -le 18000000
          ls -lh "$stage/bin/shotcli" "$stage/lib/libshot.so" "WebKitBuild/releases/${name}.tar.xz"

      - name: Enforce native runtime closure budget
        run: |
          node_bytes=$(( $(stat -c %s WebKitBuild/node-runtime/shot.node) + $(stat -c %s WebKitBuild/node-runtime/lib/libshot.so) ))
          cli_bytes=$(( $(stat -c %s WebKitBuild/releases/shotkit-linux-${{ matrix.arch }}/lib/libshot.so) + $(stat -c %s WebKitBuild/releases/shotkit-linux-${{ matrix.arch }}/bin/shotcli) ))
          echo "shot.node closure: $node_bytes bytes; CLI closure: $cli_bytes bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$node_bytes" -le $(( cli_bytes * 105 / 100 ))

      - name: Upload the release archive
        uses: actions/upload-artifact@v7
        with:
          name: engine-linux-${{ matrix.arch }}-${{ steps.fingerprint.outputs.fingerprint }}
          path: |
            WebKitBuild/releases/*.tar.xz
            WebKitBuild/releases/*.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: true

      - name: Upload the addon closure
        uses: actions/upload-artifact@v7
        with:
          name: engine-node-linux-${{ matrix.arch }}-${{ steps.fingerprint.outputs.fingerprint }}
          path: WebKitBuild/node-runtime/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
