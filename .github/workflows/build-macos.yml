# Builds the macos engines and uploads them under the engine
# fingerprint: engine-macos-<arch>-<fingerprint> (the release archive)
# and engine-node-macos-<arch>-<fingerprint> (the addon closure). Called
# by build.yml for the architectures whose artifacts are missing; the
# dispatch form builds by hand. Tests that need the SDK run in build.yml's
# verify job against these artifacts, on every run, whether or not anything
# was built here.
#
# No push trigger and no concurrency group: build.yml is the entry point
# and owns both. A called workflow that shared a group with its caller
# would cancel or deadlock itself.
name: build-macos

on:
  workflow_call:
    inputs:
      archs:
        description: 'JSON list of the architectures to build, e.g. ["x64","arm64"]'
        type: string
        default: '["x64","arm64"]'
      fingerprint:
        description: the engine fingerprint the artifacts are named after; computed here when empty
        type: string
        default: ''
      lto:
        description: Link-time optimization mode
        type: string
        default: full
      ref:
        description: the commit to build; empty builds the triggering ref
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      archs:
        description: architectures to build
        type: choice
        options: ['["x64","arm64"]', '["x64"]', '["arm64"]']
        default: '["x64","arm64"]'
      lto:
        description: Link-time optimization mode
        type: choice
        options: [full, thin]
        default: full

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: "build: macos-${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 360
    env:
      SHOT_COMPILER_LAUNCHER: ccache
      # ccache, persisted as the ccache-<os>-<arch> artifact between runs.
      # Not the Actions cache: that evicted everything after seven idle days
      # and kept a pull request's entries invisible to main, so the first
      # build after any quiet week was cold. direct + depend mode means a hit
      # never runs the preprocessor, which is what made sccache's warm
      # compile still take nine minutes here.
      # CCACHE_DIR is set by the unpack step: the runner context is not
      # available in a job's env.
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_DEPEND: '1'
      CCACHE_NOHASHDIR: '1'
      CCACHE_BASEDIR: ${{ github.workspace }}
      # ivfsoverlay: OptionsCocoa compiles every TU with -ivfsoverlay so the
      # SDK's Availability.h resolves to WebKitLibraries/AvailabilityOverlay;
      # ccache refuses the option outright unless told to ignore it. It then
      # hashes the SDK header the overlay hides, not the one actually read,
      # so the two overlay headers go into every hash by hand.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime,ivfsoverlay
      CCACHE_EXTRAFILES: ${{ github.workspace }}/WebKitLibraries/AvailabilityOverlay/usr/include/os/availability.h:${{ github.workspace }}/WebKitLibraries/AvailabilityOverlay/usr/include/Availability.h

    steps:
      - name: Checkout the ShotKit build closure
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /Source/
            /shot/
            /apps/node/
            /scripts/
            /tests/
            /Tools/
            /WebKitLibraries/
            /CMakeLists.txt
            /CMakePresets.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - name: Engine fingerprint
        id: fingerprint
        shell: bash
        env:
          FROM_CALLER: ${{ inputs.fingerprint }}
          LTO: ${{ inputs.lto || 'full' }}
        # The caller computed it for the tree it is building; a dispatch
        # computes it here. Either way it names this run's artifacts.
        run: |
          if [ -n "$FROM_CALLER" ]; then echo "fingerprint=$FROM_CALLER" >> "$GITHUB_OUTPUT"; echo "$FROM_CALLER (from the caller)"; else node scripts/ci/fingerprint.mjs --lto "$LTO" --output; fi

      - name: Install Node binding build dependencies
        working-directory: apps/node
        run: npm ci

      - name: Select the newest supported Xcode
        run: |
          # Prefer 26.3 (the arm64 baseline); the Intel image may only carry
          # older toolchains, and the port also supports Xcode 16.4 Swift.
          xcode=""
          for candidate in /Applications/Xcode_26.3.app $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr) /Applications/Xcode_16.4.app; do
            if [ -d "$candidate" ]; then xcode="$candidate"; break; fi
          done
          if [ -z "$xcode" ]; then
            echo "no supported Xcode found; available toolchains:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          echo "selected $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install build dependencies
        run: |
          brew install bison ccache cmake gperf icu4c ninja webp
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix icu4c)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix icu4c);$(brew --prefix webp)" >> "$GITHUB_ENV"
          cmake --version
          ninja --version
          clang --version
          ccache --version | head -1

      - name: Restore the compiler cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/artifacts.mjs download --name ccache-macos-${{ matrix.arch }} --dir "$RUNNER_TEMP/ccache-dl"

      - name: Unpack the compiler cache
        shell: bash
        # GNU tar under Git Bash reads D:\ as a host name, so paths go
        # through cygpath where it exists.
        run: |
          tmp="$RUNNER_TEMP"; command -v cygpath >/dev/null 2>&1 && tmp="$(cygpath "$RUNNER_TEMP")"
          mkdir -p "$tmp/ccache"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          mkdir -p "$tmp/ccache-dl"
          tarball="$(find "$tmp/ccache-dl" -name ccache.tar | head -1)"
          if [ -n "$tarball" ]; then tar -xf "$tarball" -C "$tmp"; echo "restored $(du -sh "$tmp/ccache" | cut -f1)"; else echo "no compiler cache yet: cold"; fi
          ccache -z
          ccache -p | grep -E '^\(environment\)' || true

      - name: Configure ShotKit
        run: |
          echo "compiler launcher: ${SHOT_COMPILER_LAUNCHER:-(none)}"
          launcher_args=()
          if [[ -n "${SHOT_COMPILER_LAUNCHER:-}" ]]; then
            # The Apple port compiles a large amount of Objective-C++, so the
            # ObjC launchers matter as much as the C/C++ ones here.
            launcher_args+=(
              "-DCMAKE_C_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
              "-DCMAKE_CXX_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
              "-DCMAKE_OBJC_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
              "-DCMAKE_OBJCXX_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
            )
          fi

          cmake -S . -B WebKitBuild/shot-macos -G Ninja \
            -DPORT=Shot \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DSHOT_NODE_API_INCLUDE_DIR="$GITHUB_WORKSPACE/apps/node/node_modules/node-api-headers/include" \
            -DLTO_MODE=full \
            "${launcher_args[@]}"

      - name: Build ShotKit
        id: build
        run: ninja -C WebKitBuild/shot-macos -j3 shotcli shotnode shot_capi_thread_test

      - name: Compiler cache statistics
        id: ccache-stats
        if: always() && steps.build.outcome != 'skipped'
        shell: bash
        run: |
          ccache --cleanup
          ccache -s -v | tee -a "$GITHUB_STEP_SUMMARY"
          misses=$(ccache --print-stats | awk -F'\t' '$1=="cache_miss"{print $2}')
          echo "misses=${misses:-0}" >> "$GITHUB_OUTPUT"

      # Only when the cache gained something, and never from a fork's pull
      # request (its upload would not be trusted anyway).
      - name: Pack the compiler cache
        id: ccache-pack
        if: always() && steps.ccache-stats.outputs.misses != '0' && steps.ccache-stats.outputs.misses != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          tmp="$RUNNER_TEMP"; command -v cygpath >/dev/null 2>&1 && tmp="$(cygpath "$RUNNER_TEMP")"
          rm -rf "$tmp/ccache-dl"
          tar -cf "$tmp/ccache.tar" -C "$tmp" ccache
          ls -l "$tmp/ccache.tar"
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save the compiler cache
        if: always() && steps.ccache-pack.outputs.save == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ccache-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/ccache.tar
          compression-level: 0
          retention-days: 90
          overwrite: true

      - name: Verify internal link closure
        run: |
          unresolved=$(nm -u WebKitBuild/shot-macos/lib/libshot.dylib | awk '{print $NF}' | grep -E '^_+ZN7WebCore|^_OBJC_(CLASS|METACLASS)_\$_Web' || true)
          if [[ -n "$unresolved" ]]; then
            printf '%s\n' "$unresolved"
            exit 1
          fi

      # The SDK suite, parity, the soak (which owns the 1000-render macOS
      # stability gate), the network fixture and the XML/XSLT checks run in
      # build.yml's verify job against the uploaded artifacts; only the C
      # ABI ownership test stays here, since it is not shipped.
      - name: Verify C ABI thread ownership
        run: WebKitBuild/shot-macos/bin/shot_capi_thread_test 1

      - name: Verify ABI and relocatable CLI
        run: |
          exports=$(nm -gU WebKitBuild/shot-macos/lib/libshot.dylib | awk '{print $NF}' | grep '^_shot_' | sort)
          test "$(printf '%s\n' "$exports" | grep -c '^_shot_')" -eq 10
          otool -l WebKitBuild/shot-macos/bin/shotcli | grep -F '@loader_path/../lib'
          addon_exports=$(nm -gU WebKitBuild/shot-macos/bin/shot.node | awk '{print $NF}')
          grep -q '^_napi_register_module_v1$' <<<"$addon_exports"
          if grep -q '^_shot_' <<<"$addon_exports"; then echo 'shot.node leaked C ABI exports' >&2; exit 1; fi
          ls -lh WebKitBuild/shot-macos/lib/libshot.dylib WebKitBuild/shot-macos/bin/shotcli WebKitBuild/shot-macos/bin/shot.node

      - name: Stage native npm runtime
        run: |
          # shot.node is a thin addon over libshot.dylib, which travels with
          # it under lib/ (LC_RPATH @loader_path/lib).
          stage=WebKitBuild/node-runtime
          rm -rf "$stage"
          mkdir -p "$stage/lib"
          cp WebKitBuild/shot-macos/bin/shot.node "$stage/"
          cp WebKitBuild/shot-macos/lib/libshot.dylib "$stage/lib/"
          strip -x "$stage/shot.node" "$stage/lib/libshot.dylib"
          otool -L "$stage/shot.node" > "$stage/DEPENDENCIES.txt"
          grep -F '@rpath/libshot.dylib' "$stage/DEPENDENCIES.txt" || { echo 'shot.node does not import libshot.dylib through @rpath' >&2; cat "$stage/DEPENDENCIES.txt"; exit 1; }

      - name: Package release archive
        run: |
          # No version in the name: the archive unpacks to a stable
          # shotkit-macos-<arch>/ directory. The release job stamps the tag onto
          # the file name of the public download.
          name="shotkit-macos-${{ matrix.arch }}"
          stage="WebKitBuild/releases/${name}"
          rm -rf "$stage"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/include"
          cp WebKitBuild/shot-macos/bin/shotcli "$stage/bin/"
          cp WebKitBuild/shot-macos/lib/libshot.dylib "$stage/lib/"
          cp shot/capi/shot.h "$stage/include/"
          strip -x "$stage/bin/shotcli" "$stage/lib/libshot.dylib"
          otool -L "$stage/lib/libshot.dylib" > "$stage/DEPENDENCIES.txt"
          # A generated README, not the repository's: the archive is reused
          # across releases by fingerprint, and a README copied from the
          # tree would go stale without changing the fingerprint.
          {
            echo "ShotKit - macOS ${{ matrix.arch }}"
            echo
            echo "Static HTML/CSS screenshot kernel. Page JavaScript and WebAssembly are disabled."
            echo "Extract the complete archive before use; the downloaded file name carries the"
            echo "release version, the directory it unpacks into does not."
            echo
            echo "CLI:"
            echo "  bin/shotcli --url https://example.com --out example.png"
            echo "  bin/shotcli --html page.html --out page.webp --format webp"
            echo
            echo "C ABI:"
            echo "  Header: include/shot.h"
            echo "  Library: lib/libshot.dylib"
          } > "$stage/README.txt"
          tar -C WebKitBuild/releases -cJf "WebKitBuild/releases/${name}.tar.xz" "$name"
          # Bare file name, not the build path — see the note in linux.yml.
          ( cd WebKitBuild/releases && shasum -a 256 "${name}.tar.xz" > "${name}.tar.xz.sha256" )
          ls -lh "$stage/bin/shotcli" "$stage/lib/libshot.dylib" "WebKitBuild/releases/${name}.tar.xz"

      - name: Enforce native runtime closure budget
        run: |
          node_bytes=$(( $(stat -f %z WebKitBuild/node-runtime/shot.node) + $(stat -f %z WebKitBuild/node-runtime/lib/libshot.dylib) ))
          cli_bytes=$(( $(stat -f %z WebKitBuild/releases/shotkit-macos-${{ matrix.arch }}/lib/libshot.dylib) + $(stat -f %z WebKitBuild/releases/shotkit-macos-${{ matrix.arch }}/bin/shotcli) ))
          echo "shot.node closure: $node_bytes bytes; CLI closure: $cli_bytes bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$node_bytes" -le $(( cli_bytes * 105 / 100 ))
          # The same archive budget Linux has; the macOS archives are 8-10 MB.
          archive_bytes=$(stat -f %z "WebKitBuild/releases/shotkit-macos-${{ matrix.arch }}.tar.xz")
          echo "release tar.xz: ${archive_bytes} bytes (budget 18000000)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$archive_bytes" -le 18000000

      - name: Upload the release archive
        uses: actions/upload-artifact@v7
        with:
          name: engine-macos-${{ matrix.arch }}-${{ steps.fingerprint.outputs.fingerprint }}
          path: |
            WebKitBuild/releases/*.tar.xz
            WebKitBuild/releases/*.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: true

      - name: Upload the addon closure
        uses: actions/upload-artifact@v7
        with:
          name: engine-node-macos-${{ matrix.arch }}-${{ steps.fingerprint.outputs.fingerprint }}
          path: WebKitBuild/node-runtime/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
