# Every pull request: the engines (built only if this tree's fingerprint has
# none yet, otherwise reused), the six-platform verify job, then an
# installable preview of the seven npm packages through pkg.pr.new.
#
# This is the pull-request entry point; build.yml does not listen to
# pull_request itself. A PR that changes only the SDK, the docs or the
# tooling reuses main's engines and is done in minutes.
name: PR Native Preview

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.githooks/**'
      - 'apps/benchmark/**'
      - 'apps/demo/**'
      - 'upstream-sync/**'
      - '.github/workflows/publish.yml'
      - '.github/workflows/commit-lint.yml'
      - '.github/workflows/refresh.yml'
      - '.clang-format'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: apps/node
    steps:
      - name: Checkout the Node SDK
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/node/
            /scripts/ci/

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - run: npm ci

      # The six addon closures at this fingerprint, from whichever trusted
      # run built them -- this one, if the build job had to.
      - name: Fetch the native runtimes
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          FP: ${{ needs.build.outputs.fingerprint }}
        run: |
          names=()
          for os in windows linux macos; do for arch in x64 arm64; do names+=(--name "engine-node-$os-$arch-$FP"); done; done
          node scripts/ci/artifacts.mjs download --require-all "${names[@]}" --dir "$RUNNER_TEMP/runtimes"

      - name: Stage all platform packages
        shell: bash
        run: |
          set -euo pipefail
          staged=0
          while IFS= read -r addon; do
            runtime_dir="$(dirname "$addon")"
            name="$(basename "$runtime_dir")"
            if [[ ! "$name" =~ ^engine-node-(windows|linux|macos)-(x64|arm64)-[0-9a-f]{16}$ ]]; then
              echo "unrecognized native runtime directory: $name" >&2
              exit 1
            fi

            os="${BASH_REMATCH[1]}"
            arch="${BASH_REMATCH[2]}"
            case "$os" in
              windows) platform="win32-$arch" ;;
              macos)   platform="darwin-$arch" ;;
              linux)   platform="linux-$arch" ;;
            esac
            npm run stage -- "$platform" "$runtime_dir"
            staged=$((staged + 1))
          done < <(find "$RUNNER_TEMP/runtimes" -type f -name 'shot.node' | sort)

          if [[ "$staged" -ne 6 ]]; then
            echo "expected 6 staged runtimes, got $staged" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run build

      # This injects the six optionalDependencies before pkg-pr-new rewrites
      # every sibling package to its commit-specific preview URL.
      - run: npm run sync-versions

      - name: Publish installable PR packages
        shell: bash
        run: |
          npm exec --call \
            "pkg-pr-new publish --previewVersion --comment=update --packageManager=npm --no-template './npm/*' '.'"
