name: macOS

on:
  push:
    branches: [main, codex/linux-macos-port]
    paths-ignore:
      - '**.md'
      - '.githooks/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.githooks/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    env:
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Checkout the ShotKit build closure
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /Source/
            /shot/
            /apps/node/
            /scripts/
            /tests/
            /Tools/
            /WebKitLibraries/
            /CMakeLists.txt
            /CMakePresets.json
            /AGENTS.md
            /ReadMe.md

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/node/package-lock.json

      - name: Install Node binding build dependencies
        working-directory: apps/node
        run: npm ci

      - name: Select the newest supported Xcode
        run: |
          # Prefer 26.3 (the arm64 baseline); the Intel image may only carry
          # older toolchains, and the port also supports Xcode 16.4 Swift.
          xcode=""
          for candidate in /Applications/Xcode_26.3.app $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr) /Applications/Xcode_16.4.app; do
            if [ -d "$candidate" ]; then xcode="$candidate"; break; fi
          done
          if [ -z "$xcode" ]; then
            echo "no supported Xcode found; available toolchains:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          echo "selected $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install build dependencies
        run: |
          brew install bison cmake gperf icu4c ninja webp
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix icu4c)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix icu4c);$(brew --prefix webp)" >> "$GITHUB_ENV"
          cmake --version
          ninja --version
          clang --version

      # macOS already builds with LTO off and is the fastest of the three
      # platforms, so the compiler cache is the only lever worth pulling here.
      # A failed setup leaves the build uncached rather than broken.
      - name: Set up the compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable the compiler cache
        if: steps.sccache.outcome == 'success'
        run: echo "SHOT_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      - name: Configure ShotKit
        run: |
          echo "compiler launcher: ${SHOT_COMPILER_LAUNCHER:-(none)}"
          launcher_args=()
          if [[ -n "${SHOT_COMPILER_LAUNCHER:-}" ]]; then
            # The Apple port compiles a large amount of Objective-C++, so the
            # ObjC launchers matter as much as the C/C++ ones here.
            launcher_args+=(
              "-DCMAKE_C_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
              "-DCMAKE_CXX_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
              "-DCMAKE_OBJC_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
              "-DCMAKE_OBJCXX_COMPILER_LAUNCHER=$SHOT_COMPILER_LAUNCHER"
            )
          fi

          cmake -S . -B WebKitBuild/shot-macos -G Ninja \
            -DPORT=Shot \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DSHOT_NODE_API_INCLUDE_DIR="$GITHUB_WORKSPACE/apps/node/node_modules/node-api-headers/include" \
            -DLTO_MODE=full \
            "${launcher_args[@]}"

      - name: Build ShotKit
        run: ninja -C WebKitBuild/shot-macos -j3 shotcli shotnode shot_capi_thread_test

      - name: Compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        continue-on-error: true
        run: sccache --show-stats

      - name: Verify internal link closure
        run: |
          unresolved=$(nm -u WebKitBuild/shot-macos/lib/libshot.dylib | awk '{print $NF}' | grep -E '^_+ZN7WebCore|^_OBJC_(CLASS|METACLASS)_\$_Web' || true)
          if [[ -n "$unresolved" ]]; then
            printf '%s\n' "$unresolved"
            exit 1
          fi

      - name: Smoke test PNG and WebP
        run: |
          printf '%s\n' '<!doctype html><meta charset=utf-8><style>body{background:#eef2f7;font:32px sans-serif}h1{color:#246}</style><h1>ShotKit macOS CI</h1>' > "$RUNNER_TEMP/shot-smoke.html"
          WebKitBuild/shot-macos/bin/shotcli --html "$RUNNER_TEMP/shot-smoke.html" --out "$RUNNER_TEMP/shot-smoke.png" --width 640 --height 360
          WebKitBuild/shot-macos/bin/shotcli --html "$RUNNER_TEMP/shot-smoke.html" --out "$RUNNER_TEMP/shot-smoke.webp" --format webp --quality 82 --width 640 --height 360
          test "$(stat -f %z "$RUNNER_TEMP/shot-smoke.png")" -gt 100
          test "$(stat -f %z "$RUNNER_TEMP/shot-smoke.webp")" -gt 100

      - name: Verify C ABI thread ownership and native Node SDK
        run: |
          WebKitBuild/shot-macos/bin/shot_capi_thread_test
          SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-macos/bin/shot.node" npm test --prefix apps/node
          SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-macos/bin/shot.node" node apps/node/test/native-parity.mjs WebKitBuild/shot-macos/bin/shotcli
          SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-macos/bin/shot.node" node --expose-gc apps/node/test/native-soak.mjs

      - name: Verify CFNetwork, scripts, and XML/XSLT
        run: |
          python3 tests/fixture_server.py 8988 > "$RUNNER_TEMP/fixture.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8988/reset-counts >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8988/reset-counts >/dev/null
          WebKitBuild/shot-macos/bin/shotcli --url http://127.0.0.1:8988/script-network --out "$RUNNER_TEMP/no-script-network.png" --timeout 5000
          counts=$(curl -fsS http://127.0.0.1:8988/request-counts)
          python3 -c 'import json,sys; counts=json.loads(sys.argv[1]); assert counts == {"/script-network": 1}, counts' "$counts"
          WebKitBuild/shot-macos/bin/shotcli --url http://127.0.0.1:8988/document.xml --out "$RUNNER_TEMP/xslt.png" --timeout 5000
          test "$(stat -f %z "$RUNNER_TEMP/xslt.png")" -gt 100
          SHOTKIT_NATIVE_PATH="$GITHUB_WORKSPACE/WebKitBuild/shot-macos/bin/shot.node" node --input-type=module -e \
            "import {launch} from './apps/node/dist/index.mjs'; const s=await launch(); const r=await s.screenshotURL('http://127.0.0.1:8988/document.xml',{mimeType:'application/xml',timeoutMs:5000}); if(r.bytes<100) throw new Error('native CFNetwork/XML output too small'); await s.close();"

      - name: Verify ABI and relocatable CLI
        run: |
          exports=$(nm -gU WebKitBuild/shot-macos/lib/libshot.dylib | awk '{print $NF}' | grep '^_shot_' | sort)
          test "$(printf '%s\n' "$exports" | grep -c '^_shot_')" -eq 10
          otool -l WebKitBuild/shot-macos/bin/shotcli | grep -F '@loader_path/../lib'
          addon_exports=$(nm -gU WebKitBuild/shot-macos/bin/shot.node | awk '{print $NF}')
          grep -q '^_napi_register_module_v1$' <<<"$addon_exports"
          if grep -q '^_shot_' <<<"$addon_exports"; then echo 'shot.node leaked C ABI exports' >&2; exit 1; fi
          ls -lh WebKitBuild/shot-macos/lib/libshot.dylib WebKitBuild/shot-macos/bin/shotcli WebKitBuild/shot-macos/bin/shot.node

      - name: Stage native npm runtime
        run: |
          stage=WebKitBuild/node-runtime
          rm -rf "$stage"
          mkdir -p "$stage"
          cp WebKitBuild/shot-macos/bin/shot.node "$stage/"
          strip -x "$stage/shot.node"
          otool -L "$stage/shot.node" > "$stage/DEPENDENCIES.txt"

      - name: Package release archive
        run: |
          # No version in the name: the archive unpacks to a stable
          # shotkit-macos-<arch>/ directory. The release job stamps the tag onto
          # the file name of the public download.
          name="shotkit-macos-${{ matrix.arch }}"
          stage="WebKitBuild/releases/${name}"
          rm -rf "$stage"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/include"
          cp WebKitBuild/shot-macos/bin/shotcli "$stage/bin/"
          cp WebKitBuild/shot-macos/lib/libshot.dylib "$stage/lib/"
          cp shot/capi/shot.h "$stage/include/"
          strip -x "$stage/bin/shotcli" "$stage/lib/libshot.dylib"
          otool -L "$stage/lib/libshot.dylib" > "$stage/DEPENDENCIES.txt"
          cp ReadMe.md "$stage/README.md"
          tar -C WebKitBuild/releases -cJf "WebKitBuild/releases/${name}.tar.xz" "$name"
          # Bare file name, not the build path — see the note in linux.yml.
          ( cd WebKitBuild/releases && shasum -a 256 "${name}.tar.xz" > "${name}.tar.xz.sha256" )
          ls -lh "$stage/bin/shotcli" "$stage/lib/libshot.dylib" "WebKitBuild/releases/${name}.tar.xz"

      - name: Enforce native runtime closure budget
        run: |
          node_bytes=$(stat -f %z WebKitBuild/node-runtime/shot.node)
          cli_bytes=$(( $(stat -f %z WebKitBuild/releases/shotkit-macos-${{ matrix.arch }}/lib/libshot.dylib) + $(stat -f %z WebKitBuild/releases/shotkit-macos-${{ matrix.arch }}/bin/shotcli) ))
          echo "shot.node closure: $node_bytes bytes; CLI closure: $cli_bytes bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$node_bytes" -le $(( cli_bytes * 105 / 100 ))

      - name: Upload compressed release
        uses: actions/upload-artifact@v7
        with:
          name: shotkit-macos-${{ matrix.arch }}
          path: |
            WebKitBuild/releases/*.tar.xz
            WebKitBuild/releases/*.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload native npm runtime
        uses: actions/upload-artifact@v7
        with:
          name: shotkit-node-macos-${{ matrix.arch }}
          path: WebKitBuild/node-runtime/
          if-no-files-found: error
          retention-days: 7
